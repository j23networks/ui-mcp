[project]
name = "ubiquiti-mcp"
version = "0.1.0"
description = "MCP server for the Ubiquiti / UniFi APIs (Network, Site Manager, Protect)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
ui-mcp = "ubiquiti_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubiquiti_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
